name: Validate CashPix reconciliation
on:
  push:
    branches: ['validate/cashpix-pix-provider-reconciliation']
  pull_request:
    branches: ['fix/cashpix-pix-provider-reconciliation']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PIX_API_TOKEN: fake-test-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies and compile provider
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app/core.py app/routers/pix.py
          npm install --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Run HTTP-to-PostgreSQL cases with simulated provider
        run: |
          cat > validate_provider.py <<'PY'
          import tempfile
          import os
          import uvicorn
          from fastapi import FastAPI
          from app.routers import pix
          
          temp = tempfile.TemporaryDirectory()
          os.environ["CASHPIX_REVIEW_JOURNAL_PATH"] = os.path.join(temp.name, "review.db")
          pix._ensure_auth = lambda: None
          def provider(cart, run, max_attempts, interval):
              assert max_attempts == 1 and interval == 0
              if cart == "cart-1":
                  return {"done": True, "body": {"status": "completed", "orderId": "order-1"}}
              if cart == "cart-2":
                  return {"done": True, "body": {"status": "rejected", "title": "chave inválida"}}
              return {"done": True, "body": {"status": "pending", "orderId": "order-3"}}
          pix.poll_status = provider
          for i in (1, 2, 3):
              pix._save_cashpix_purchase(
                  "11111111-1111-4111-8111-11111111111" + str(i),
                  "00000000-0000-4000-8000-00000000000" + str(i),
                  "2.00", f"cart-{i}", f"run-{i}", f"pix-reference-{i}",
              )
          app = FastAPI()
          app.include_router(pix.router)
          uvicorn.run(app, host="127.0.0.1", port=8090)
          PY
          cat > validate_cashpix.cjs <<'JS'
          const {PGlite}=require('@electric-sql/pglite');
          const assert=require('node:assert/strict');
          const PIX_API_URL='http://127.0.0.1:8090';
          const pg=new PGlite();
          const db={getClient:async()=>({query:(...a)=>pg.query(...a),release(){}})};
          const snapshotOf=v=>v||{};
          const REVIEW_REASONS = {
            completed: 'Pagamento PIX confirmado pelo provedor durante a conferência.',
            failed: 'O provedor confirmou a falha do pagamento PIX.',
            unavailable: 'O provedor não encontrou uma tentativa vinculada a este saque.',
            unverified: 'O provedor ainda não apresentou confirmação conclusiva para este pagamento.',
            communication_error: 'Não foi possível consultar o provedor PIX.',
            duplicate_reference: 'A referência do pagamento já consta em outro saque. Confira manualmente.',
          };
          
          function reviewOutcome(result, expected) {
            if (result?.status === 'unavailable') return { status: 'unavailable' };
            if (result?.attempt_id !== expected.attempt_id || result.withdrawal_id !== expected.withdrawal_id ||
                result.amount !== expected.amount || result.authoritative !== true) return { status: 'unverified' };
            if (result.status === 'failed') {
              return { status: 'failed', reason: typeof result.reason === 'string' ? result.reason.slice(0, 250) : null };
            }
            if (result.status === 'completed' && typeof result.reference === 'string' &&
                /^[A-Za-z0-9_-]{1,160}$/.test(result.reference) &&
                !/^(?:unknown|null|none|0)$/i.test(result.reference)) {
              const receipt = typeof result.receipt_url === 'string' && result.receipt_url.length <= 2048 &&
                /^https:\/\/(?:[a-z0-9-]+\.)*recargapay\.com\.br\/(?:[^?#]*)(?:voucher|receipt)(?:[^?#]*)(?:[?#].*)?$/i.test(result.receipt_url)
                ? result.receipt_url : null;
              return { status: 'completed', reference: result.reference, receipt };
            }
            return { status: 'unverified' };
          }
          
          async function fetchPaymentReview(w) {
            const expected = { attempt_id: w.gateway_response.pixReviewAttempt, withdrawal_id: String(w.id), amount: Number(w.amount).toFixed(2) };
            try {
              const response = await fetch(`${PIX_API_URL}/pix/payment-review`, {
                method: 'POST', signal: AbortSignal.timeout(15000),
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.PIX_API_TOKEN}` },
                body: JSON.stringify(expected),
              });
              if (!response.ok) return { status: 'communication_error', http: response.status };
              return reviewOutcome(await response.json(), expected);
            } catch {
              return { status: 'communication_error' };
            }
          }
          
          async function storePaymentReview(w, outcome) {
            const client = await db.getClient();
            try {
              await client.query('BEGIN');
              const found = await client.query(
                "SELECT status, gateway_response, updated_at::text AS version FROM withdrawals WHERE id=$1 FOR UPDATE", [w.id],
              );
              const current = found.rows[0];
              if (current?.status !== 'PAYMENT_UNCONFIRMED' || current.version !== w.version) {
                await client.query('ROLLBACK');
                return;
              }
              const original = snapshotOf(current.gateway_response);
              let { status, reference, receipt, reason, http } = outcome;
              if (status === 'completed') {
                await client.query('SELECT pg_advisory_xact_lock(hashtext($1))', [`cashpix-review:${reference}`]);
                const duplicate = await client.query('SELECT 1 FROM withdrawals WHERE tx_hash=$1 AND id<>$2 LIMIT 1', [reference, w.id]);
                if (duplicate.rows.length || (original.providerReference && original.providerReference !== reference)) {
                  status = 'duplicate_reference';
                  reference = null;
                  receipt = null;
                }
              }
              const confirmed = status === 'completed';
              const detail = {
                providerStatus: status,
                error: reason || REVIEW_REASONS[status],
                errorCode: http ? `PIX_REVIEW_HTTP_${http}` : `PIX_REVIEW_${status.toUpperCase()}`,
                providerReference: reference || original.providerReference || null,
                providerReceipt: receipt || null,
                providerConfirmed: confirmed || original.providerConfirmed === true,
                auto_withdrawal: original.auto_withdrawal === true,
              };
              const gateway = JSON.stringify({ ...detail, pixReviewCheckedAt: new Date().toISOString() });
              if (confirmed) {
                await client.query(
                  `UPDATE withdrawals SET status='PAID', tx_hash=$3, processed_at=NOW(),
                   gateway_response=gateway_response || $2::jsonb, updated_at=NOW() WHERE id=$1`,
                  [w.id, gateway, reference],
                );
              } else {
                await client.query(
                  'UPDATE withdrawals SET gateway_response=gateway_response || $2::jsonb, updated_at=NOW() WHERE id=$1',
                  [w.id, gateway],
                );
              }
              if (original.providerStatus !== status || original.error !== detail.error || original.errorCode !== detail.errorCode) {
                await client.query(
                  `INSERT INTO audit_log (actor_id, actor_type, action, target_type, target_id, new_value)
                   VALUES (NULL,'system','PIX_PAYMENT_PROVIDER_REVIEW','withdrawal',$1,$2)`,
                  [w.id, JSON.stringify(detail)],
                );
              }
              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK').catch(() => {});
              throw error;
            } finally {
              client.release();
            }
          }
          
          
          async function run() {
            await pg.exec(`CREATE TABLE withdrawals (id uuid PRIMARY KEY, status text NOT NULL, tx_hash text,
              amount numeric, processed_at timestamptz, updated_at timestamptz DEFAULT NOW(), gateway_response jsonb);
              CREATE TABLE audit_log (actor_id text,actor_type text,action text,target_type text,target_id uuid,new_value jsonb);`);
            for (const [suffix, expected] of [['1','completed'],['2','failed'],['3','unverified'],['4','unavailable']]) {
              const id='00000000-0000-4000-8000-00000000000'+suffix;
              const attempt='11111111-1111-4111-8111-11111111111'+suffix;
              await pg.query("INSERT INTO withdrawals(id,amount,status,gateway_response) VALUES($1,2.00,'PAYMENT_UNCONFIRMED',$2)",[id,{pixReviewAttempt:attempt,auto_withdrawal:true}]);
              const {rows:[row]}=await pg.query('SELECT *,updated_at::text version FROM withdrawals WHERE id=$1',[id]);
              const outcome=await fetchPaymentReview(row);
              assert.equal(outcome.status,expected);
              await storePaymentReview(row,outcome);
              const {rows:[after]}=await pg.query('SELECT * FROM withdrawals WHERE id=$1',[id]);
              assert.equal(after.status,expected==='completed'?'PAID':'PAYMENT_UNCONFIRMED');
              const {rows:[event]}=await pg.query('SELECT * FROM audit_log WHERE target_id=$1',[id]);
              assert.equal(event.new_value.providerStatus,expected);
              if(expected==='failed') assert.match(event.new_value.error,/chave PIX foi recusada/);
              if(expected==='completed') assert.equal(after.tx_hash,'pix-reference-1');
            }
            await pg.close();
          }
          run().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          python validate_provider.py &
          provider=$!
          trap 'kill "$provider" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8090/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          node validate_cashpix.cjs
